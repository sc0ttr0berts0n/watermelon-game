<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="application-name" content="💍Ring Game" />
    <meta name="apple-mobile-web-app-title" content="💍Ring Game" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#00cdab" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💍🎉</title>
  </head>
  <body>
    <div id="app">
      <div class="version"></div>
      <div class="scoreboard--toggle hidden">🏆</div>
      <div class="scoreboard--container hidden">
        <div class="scoreboard--wrapper">
          <div class="scoreboard--title">Leaderboard</div>
          <div class="scoreboard--board-wrapper">
            <div class="scoreboard--board scoreboard--board__weekly">
              <div class="scoreboard--header">Daily Top 10</div>
              <div class="scoreboard--entries"></div>
            </div>
            <div class="scoreboard--board scoreboard--board__overall">
              <div class="scoreboard--header">Overall Top 10</div>
              <div class="scoreboard--entries"></div>
            </div>
          </div>
          <div class="input hidden">
            <div class="form-header">New Highscore! <span class="highscore"></span></div>
            <form action="">
              <input type="text" placeholder="Your Name" maxlength="10" required>
              <button>Submit</button>
            </form>
          </div>
          <div class="close">
            <button>Close</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
